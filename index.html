        // Inicialización
        async function initApp() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                
                // NEW FIRESTORE INIT (Fixes deprecation warning)
                db = initializeFirestore(app, {
                    localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
                });

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) {
                        // LOGGED IN
                        const name = user.email.split('@')[0];
                        userGreetingEl.textContent = name.charAt(0).toUpperCase() + name.slice(1);
                        loginContainer.classList.add('hidden');
                        userContainer.classList.remove('hidden');
                        
                        navBtns.chat.disabled = false;
                        navBtns.history.disabled = false;
                        navBtns.chat.classList.remove('text-gray-300');
                        navBtns.history.classList.remove('text-gray-300');
                        navBtns.chat.classList.add('text-gray-400');
                        navBtns.history.classList.add('text-gray-400');
                        
                        loadHistory();
                    } else {
                        // LOGGED OUT
                        userGreetingEl.textContent = "Guest";
                        loginContainer.classList.remove('hidden');
                        userContainer.classList.add('hidden');
                        
                        navBtns.chat.disabled = true;
                        navBtns.history.disabled = true;
                        navBtns.chat.classList.add('text-gray-300');
                        navBtns.history.classList.add('text-gray-300');
                        navBtns.chat.classList.remove('text-blue-600', 'text-gray-400');
                        navBtns.history.classList.remove('text-blue-600', 'text-gray-400');
                        
                        if (currentTab !== 'timer') switchTab('timer');
                    }
                });
            } catch (e) { console.error("Init error", e); }
        }

        // --- TIMER LOGIC ---
        function loadTimerState() {
            const savedStart = localStorage.getItem('fastStartTime');
            const savedRun = localStorage.getItem('fastRunning');
            if (savedStart && savedRun === 'true') {
                startTime = parseInt(savedStart);
                running = true;
                startTicker();
                // Hide start button logic handled in updateUI/CSS ideally, but keeping consistent with requested logic
            }
        }

        function startTicker() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateUI, 1000);
            updateUI();
            // Hack para background timer en iOS (triggered only on user action)
            if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') {
                 // Tone.start() usually goes here but silentAudio handles the hack
            }
            silentAudio.play().catch(() => {}); 
            if (navigator.serviceWorker?.controller) {
                navigator.serviceWorker.controller.postMessage('START_TIMER');
            }
        }

        function updateUI() {
            if (!running || !startTime) return;
            const now = Date.now();
            const diff = Math.floor((now - startTime) / 1000);
            elapsedHours = diff / 3600;
            
            // Format Time
            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);
            const s = diff % 60;
            chronometerEl.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            
            // Phase Logic
            const phase = fastingData.find(p => elapsedHours >= p.fase_inicio_h && elapsedHours < p.fase_fin_h) || fastingData[fastingData.length-1];
            phaseNameEl.textContent = phase.keyword;
            phaseNameEl.style.color = phase.color_hex;
            timerMessageEl.textContent = phase.tip;
            
            // SVG Progress
            const maxHours = 24; // Ciclo de 24h para el círculo visual
            const pct = Math.min(elapsedHours / maxHours, 1);
            const offset = 283 - (pct * 283);
            progressCircle.style.strokeDashoffset = offset;
            progressCircle.style.stroke = phase.color_hex;
            
            // Media Session
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: `${h}:${m}:${s}`,
                    artist: `Phase: ${phase.keyword}`,
                    album: 'FastMind'
                });
            }
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            if (running) return;
            startTime = Date.now();
            running = true;
            localStorage.setItem('fastStartTime', startTime);
            localStorage.setItem('fastRunning', 'true');
            startTicker();
        });

        document.getElementById('btn-stop').addEventListener('click', async () => {
            if (!running) return;
            running = false;
            localStorage.removeItem('fastStartTime');
            localStorage.removeItem('fastRunning');
            clearInterval(timerInterval);
            
            const duration = chronometerEl.textContent;
            const phase = phaseNameEl.textContent;
            const color = progressCircle.style.stroke;
            
            // Reset UI
            chronometerEl.textContent = "00:00:00";
            phaseNameEl.textContent = "Ready";
            phaseNameEl.style.color = "#2563eb";
            progressCircle.style.strokeDashoffset = 283;
            progressCircle.style.stroke = "#2563eb";
            
            // Save if logged in
            if (currentUser) {
                try {
                    await addDoc(collection(db, "artifacts", "fastmind-c6603", "users", currentUser.uid, "fasts"), {
                        userId: currentUser.uid,
                        completedAt: serverTimestamp(),
                        durationString: duration,
                        durationHours: elapsedHours,
                        finalPhase: phase,
                        finalPhaseColor: color
                    });
                    timerMessageEl.innerHTML = "<span class='text-green-500'>Fasting Saved!</span>";
                } catch (e) {
                    timerMessageEl.innerHTML = "<span class='text-orange-500'>Saved offline. Will sync later.</span>";
                }
            } else {
                timerMessageEl.innerHTML = "<span class='text-red-400'>Login below to save history</span>";
                loginContainer.scrollIntoView({behavior: "smooth"});
            }
            
            if (navigator.serviceWorker?.controller) {
                navigator.serviceWorker.controller.postMessage('STOP_TIMER');
            }
        });

        // --- NAVIGATION ---
        let activeTab = 'timer';
        function switchTab(tab) {
            if ((tab === 'chat' || tab === 'history') && !currentUser) {
                authMessageEl.textContent = "Please log in to access this feature.";
                loginContainer.scrollIntoView({behavior: "smooth"});
                return;
            }
            
            activeTab = tab;
            // Hide all
            Object.values(views).forEach(el => el.classList.add('hidden'));
            // Reset nav colors
            Object.values(navBtns).forEach(el => {
                el.classList.remove('text-blue-600', 'scale-110');
                el.classList.add('text-gray-400');
            });
            
            // Show active
            views[tab].classList.remove('hidden');
            navBtns[tab].classList.remove('text-gray-400');
            navBtns[tab].classList.add('text-blue-600', 'scale-110');
            
            if (tab === 'history') renderCalendar(currentCalendarMonth, currentCalendarYear);
        }

        navBtns.timer.addEventListener('click', () => switchTab('timer'));
        navBtns.chat.addEventListener('click', () => switchTab('chat'));
        navBtns.history.addEventListener('click', () => switchTab('history'));

        // --- AUTHENTICATION HANDLERS ---
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            authMessageEl.textContent = "Processing...";
            authSubmitBtn.disabled = true;
            
            try {
                if (isRegisterMode) {
                    await createUserWithEmailAndPassword(auth, email, pass);
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
                authMessageEl.textContent = "";
            } catch (err) {
                authMessageEl.textContent = err.message.replace("Firebase: ", "");
            } finally {
                authSubmitBtn.disabled = false;
            }
        });

        document.getElementById('auth-toggle').addEventListener('click', (e) => {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            authTitleEl.textContent = isRegisterMode ? "Create Account" : "Login to Save History";
            authSubmitBtn.textContent = isRegisterMode ? "Register" : "Login";
            e.target.textContent = isRegisterMode ? "Have an account? Login" : "Need an account? Register";
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
        document.getElementById('forgot-password').addEventListener('click', (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            if(!email) { authMessageEl.textContent = "Enter email first"; return; }
            sendPasswordResetEmail(auth, email)
                .then(() => alert("Reset link sent to email"))
                .catch(e => authMessageEl.textContent = e.message);
        });

        // --- CHAT (RAG) ---
        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            const historyDiv = document.getElementById('chat-history');
            // User Msg
            historyDiv.innerHTML += `<div class="flex justify-end"><div class="bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none text-sm max-w-[80%]">${text}</div></div>`;
            input.value = "";
            document.getElementById('chat-spinner').classList.remove('hidden');
            historyDiv.scrollTop = historyDiv.scrollHeight;

            // RAG Prompt
            const prompt = `Context: User is asking about fasting. 
            Knowledge Base: "Intermittent fasting (16/8, TRF) improves metabolic health. Benefits: autophagy, renewal."
            Question: ${text}
            Answer concisely as a coach.`;
            
            try {
                const apiKey = "AIzaSyAGWbP_rv989PNREnA5Dh1dUEh2cyhHJZ8"; // Tu clave de Gemini
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                
                historyDiv.innerHTML += `<div class="flex gap-3"><div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-lg shrink-0">🧠</div><div class="bg-gray-100 p-3 rounded-2xl rounded-tl-none text-sm text-gray-800 max-w-[85%]">${reply}</div></div>`;
            } catch (err) {
                historyDiv.innerHTML += `<div class="text-red-500 text-xs text-center">Error connecting to AI</div>`;
            }
            document.getElementById('chat-spinner').classList.add('hidden');
            historyDiv.scrollTop = historyDiv.scrollHeight;
        });

        // --- HISTORY & CALENDAR ---
        function loadHistory() {
            const q = query(collection(db, "artifacts", "fastmind-c6603", "users", currentUser.uid, "fasts"), orderBy("completedAt", "desc"));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('history-list');
                list.innerHTML = "";
                allUserFasts = [];
                
                if (snap.empty) {
                    document.getElementById('history-empty').classList.remove('hidden');
                } else {
                    document.getElementById('history-empty').classList.add('hidden');
                    snap.forEach(doc => {
                        const data = doc.data();
                        allUserFasts.push(data);
                        const date = data.completedAt ? data.completedAt.toDate().toLocaleDateString() : "Just now";
                        list.innerHTML += `
                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100">
                                <div>
                                    <div class="text-sm font-bold text-gray-900">${date}</div>
                                    <div class="text-xs text-gray-500">Duration: ${data.durationString}</div>
                                </div>
                                <span class="text-xs font-bold px-2 py-1 rounded-lg bg-white border" style="color:${data.finalPhaseColor}; border-color:${data.finalPhaseColor}">${data.finalPhase}</span>
                            </div>`;
                    });
                    renderCalendar(currentCalendarMonth, currentCalendarYear);
                }
            });
        }

        function renderCalendar(month, year) {
            const grid = document.getElementById('calendar-grid');
            const header = document.getElementById('calendar-grid-header');
            const title = document.getElementById('month-year');
            
            grid.innerHTML = ""; header.innerHTML = "";
            const monthName = new Date(year, month).toLocaleString('default', { month: 'long' });
            title.textContent = `${monthName} ${year}`;
            
            ['S','M','T','W','T','F','S'].forEach(d => header.innerHTML += `<div>${d}</div>`);
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Fast dates set
            const fastDates = new Set(allUserFasts.map(f => f.completedAt?.toDate().toDateString()));

            for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;
            
            for(let i=1; i<=daysInMonth; i++) {
                const dateStr = new Date(year, month, i).toDateString();
                const isFasted = fastDates.has(dateStr);
                grid.innerHTML += `
                    <div class="calendar-day ${isFasted ? 'fasted-day' : ''}">
                        <span>${i}</span>
                        ${isFasted ? '<div class="fasted-dot"></div>' : ''}
                    </div>`;
            }
        }
        
        document.getElementById('prev-month').addEventListener('click', () => {
            currentCalendarMonth--;
            if(currentCalendarMonth < 0) { currentCalendarMonth = 11; currentCalendarYear--; }
            renderCalendar(currentCalendarMonth, currentCalendarYear);
        });
        document.getElementById('next-month').addEventListener('click', () => {
            currentCalendarMonth++;
            if(currentCalendarMonth > 11) { currentCalendarMonth = 0; currentCalendarYear++; }
            renderCalendar(currentCalendarMonth, currentCalendarYear);
        });

        // --- INIT ---
        loadTimerState();
        initApp();

        // Service Worker Register
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
</body>
</html>
