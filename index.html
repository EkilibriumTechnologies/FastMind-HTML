        // Importar los SDKs de Firebase que necesitamos

        import {

            signInAnonymously
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore,
            doc,
            setDoc,
            addDoc,
            collection,
            query,
            onSnapshot,
            serverTimestamp,
            orderBy,
            enableIndexedDbPersistence // <-- Offline Persistence!
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        // Nivel de log para depuración
        setLogLevel('Debug');

        // CAMBIO: __app_id es obligatorio para las rutas de Firestore
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // --- DATA (From your uploaded CSV 'fastmind_fasting_phases_en.csv') ---
        const fastingData = [
            { fase_inicio_h: 0, fase_fin_h: 4, keyword: "Digest", color_hex: "#FFA500", description: "Your body is processing the last meal and absorbing nutrients.", what_to_eat: "Water, green tea, or black coffee.", symptoms: "Drowsiness or heaviness.", recommendations: "Avoid eating again; let digestion finish.", tip: "Begin your journey calmly." },
            { fase_inicio_h: 4, fase_fin_h: 12, keyword: "Shift", color_hex: "#FFD700", description: "The body starts using liver glycogen for energy.", what_to_eat: "Water, black coffee, or mineral water.", symptoms: "Mild hunger, cravings.", recommendations: "Stay busy and drink water every hour.", tip: "Your metabolism begins to shift." },
            { fase_inicio_h: 12, fase_fin_h: 18, keyword: "Burn", color_hex: "#ADFF2F", description: "Glycogen reserves deplete and fat burning begins.", what_to_eat: "Water with electrolytes or green tea.", symptoms: "Mild headache, feeling of emptiness.", recommendations: "Stay hydrated and avoid excess caffeine.", tip: "Your body starts real fat burning." },
            { fase_inicio_h: 18, fase_fin_h: 24, keyword: "Switch", color_hex: "#00B050", description: "Ketosis activates: your body uses fat as its main energy source.", what_to_eat: "Water with pink salt or clear broth.", symptoms: "Ketone breath, unstable energy.", recommendations: "Rest or walk lightly.", tip: "You are entering repair mode." },
            { fase_inicio_h: 24, fase_fin_h: 36, keyword: "Focus", color_hex: "#00B0F0", description: "Ketosis stabilizes; mental clarity increases.", what_to_eat: "Water, herbal teas, or green tea.", symptoms: "Reduced appetite, higher focus.", recommendations: "Avoid intense exercise; listen to your body.", tip: "Your mind becomes sharper." },
            { fase_inicio_h: 36, fase_fin_h: 48, keyword: "Cleanse", color_hex: "#0070C0", description: "Autophagy begins: cells remove waste and regenerate.", what_to_eat: "Water, herbal tea, electrolytes.", symptoms: "Calm, mild fatigue possible.", recommendations: "Rest and reduce stress.", tip: "Your body is cleansing at the cellular level." },
            { fase_inicio_h: 48, fase_fin_h: 60, keyword: "Renew", color_hex: "#7030A0", description: "Damaged proteins degrade and cells renew themselves.", what_to_eat: "Water, teas, or fat-free broth.", symptoms: "Mild fatigue, occasional dizziness.", recommendations: "Take breaks and breathe deeply.", tip: "You are renewing your system." },
            { fase_inicio_h: 60, fase_fin_h: 72, keyword: "Reset", color_hex: "#9966CC", description: "Your immune system strengthens and produces new cells.", what_to_eat: "Water or mild tea.", symptoms: "Light dizziness, mental calm.", recommendations: "Avoid strong caffeine and prioritize rest.", tip: "Your body is rebooting from within." },
            { fase_inicio_h: 72, fase_fin_h: 96, keyword: "Zen", color_hex: "#708090", description: "Your metabolism becomes efficient and stable in prolonged ketosis.", what_to_eat: "Water, teas, vegetable broths.", symptoms: "Well-being, balanced energy.", recommendations: "Sleep well and stay hydrated.", tip: "You are in full control." },
            { fase_inicio_h: 96, fase_fin_h: 120, keyword: "Rebirth", color_hex: "#F5F5F5", description: "Maximum cellular regeneration achieved; time to break your fast.", what_to_eat: "Broth, light protein, soft fruits.", symptoms: "Controlled hunger, heightened senses.", recommendations: "Break your fast slowly and with care.", tip: "You have achieved a state of deep renewal." }
        ];

        // --- STATE MANAGEMENT ---
        let startTime = null; // This will be set from localStorage if a fast is running
        let running = false;
        let elapsedHours = 0;
        let chatHistory = [];
        let currentTab = 'timer';
        let timerInterval = null;
        
        // --- NEW: Firebase & Auth State ---
        let auth;
        let db;
        let currentUser = null;
        let historyUnsubscribe = null; // To stop the history listener

        let currentCalendarMonth = new Date().getMonth(); // 0-11
        let currentCalendarYear = new Date().getFullYear();
        let allUserFasts = []; // Caches all fasts to avoid re-fetching

        const timerContent = document.getElementById('timer-content');
        const chatContent = document.getElementById('chat-content');
        const historyContent = document.getElementById('history-content');
        
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const progressCircle = document.getElementById('timer-progress-circle'); // <-- ID de SVG
        const phaseNameEl = document.getElementById('phase-name');
        const chronometerEl = document.getElementById('chronometer');
        const timerMessage = document.getElementById('timer-message');
        
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatSubmit = document.getElementById('chat-submit');
        const chatHistoryEl = document.getElementById('chat-history');
        const chatSpinner = document.getElementById('chat-spinner');
        
        // --- NEW: App Shell Elements ---
        // const appNav = document.getElementById('app-nav'); // No se usa
        // const appMain = document.getElementById('app-main'); // No se usa
        const navBtnTimer = document.getElementById('nav-btn-timer');
        const navBtnChat = document.getElementById('nav-btn-chat');
        const navBtnHistory = document.getElementById('nav-btn-history');

        // --- Auth & History DOM Elements ---
        // CAMBIO: Elementos del login/user eliminados o re-purposed
        const userIdDisplayEl = document.getElementById('user-id-display'); // <-- NUEVO
        
        const historyList = document.getElementById('history-list');
        const historyLoading = document.getElementById('history-loading');
        const historyEmpty = document.getElementById('history-empty');
        
        // --- NEW: Media Session Audio Element ---
        const silentAudio = document.getElementById('silent-audio');
        
        // --- NEW: Calendar DOM Elements ---
        const btnPrevMonth = document.getElementById('prev-month');
        const btnNextMonth = document.getElementById('next-month');
        const monthYearEl = document.getElementById('month-year');
        const calendarGridHeaderEl = document.getElementById('calendar-grid-header');
        const calendarGridEl = document.getElementById('calendar-grid');

        
        // --- CORE LOGIC (Functions) ---

        function getPhase(hours) {
            const phase = fastingData.find(p => hours >= p.fase_inicio_h && hours < p.fase_fin_h);
            return phase || fastingData[fastingData.length - 1];
        }

        function formatTime(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        /**
         * ¡¡¡MODIFICADO: updateTimer() para el SVG!!!
         */
        function updateTimer() {
            if (!running || !startTime) return; // Need startTime to be set
            
            const elapsedMs = Date.now() - startTime;
            const elapsedSec = Math.floor(elapsedMs / 1000);
            const timeString = formatTime(elapsedSec);
            elapsedHours = elapsedMs / (1000 * 3600);
            
            const currentPhase = getPhase(elapsedHours);
            const maxHours = 120; // 120 horas es el 100%
            
            // Lógica del SVG
            const radius = 45;
            const circumference = 2 * Math.PI * radius; // 282.74
            const pct = Math.min(elapsedHours / maxHours, 1.0);
            const offset = circumference - (pct * circumference);
            
            progressCircle.style.strokeDashoffset = offset;
            
            // Lógica de color (del CSV)
            progressCircle.style.stroke = currentPhase.color_hex;

            // Actualizar texto
            chronometerEl.textContent = timeString;
            phaseNameEl.textContent = currentPhase.keyword;
            phaseNameEl.style.color = currentPhase.color_hex;
            
            if (running) {
                 timerMessage.textContent = currentPhase.tip;
                 updateMediaSession(timeString, currentPhase.keyword);
            }
        }

        function startTimer() {
            startTime = Date.now();
            running = true;
            elapsedHours = 0;

            localStorage.setItem('fastStartTime', startTime.toString());
            localStorage.setItem('fastRunning', 'true');

            if (timerInterval) {
                clearInterval(timerInterval);
            }
            timerInterval = setInterval(updateTimer, 1000);
            updateTimer();

            if (navigator.serviceWorker && navigator.serviceWorker.ready) {
                navigator.serviceWorker.ready.then(reg => {
                    reg.active.postMessage('START_TIMER');
                });
            }
            
            silentAudio.play().catch(e => console.log("Audio play failed (normal on init):", e));
        }

        function stopTimer() {
            if (!running) return; 
            
            running = false;
            
            localStorage.removeItem('fastStartTime');
            localStorage.removeItem('fastRunning');
            
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            const finalTime = chronometerEl.textContent;
            const finalHours = elapsedHours;
            const finalPhase = getPhase(finalHours);
            
            timerMessage.textContent = `Fast completed! Total time: ${finalTime}`;
            
            if (currentUser) {
                saveFastToFirestore(finalHours, finalTime, finalPhase);
                // La función saveFastToFirestore ahora maneja su propio mensaje de éxito/offline
            } else {
                console.log("User not logged in. Fast not saved to history.");
                timerMessage.innerHTML += "<br><em>Login to save your fast to history! (User was null)</em>";
            }

            // Reset visual
            phaseNameEl.textContent = "Not Started";
            phaseNameEl.style.color = "#2563eb"; // blue-600
            chronometerEl.textContent = "00:00:00";
            progressCircle.style.strokeDashoffset = 283; // Círculo vacío
            progressCircle.style.stroke = "#2563eb"; // blue-600
            elapsedHours = 0;
            startTime = null; 

            if (navigator.serviceWorker && navigator.serviceWorker.ready) {
                navigator.serviceWorker.ready.then(reg => {
                    reg.active.postMessage('STOP_TIMER');
                });
            }
            
            silentAudio.pause();
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = null;
                navigator.mediaSession.playbackState = "none";
            }
        }

        function updateMediaSession(timeString, phase) {

                        { src: 'https://placehold.co/192x192/111827/FFFFFF?text=🧠&font=noto', sizes: '192x192', type: 'image/png' },

        function renderChatHistory() {
            chatHistoryEl.innerHTML = `
                <div class="p-3 bg-gray-200 rounded-lg">
                    <span class="font-bold text-blue-600">💡 FastMind:</span>
                    <p class="text-gray-800">Hello! I'm FastMind. Ask me anything about fasting.</p>

                const qDiv = document.createElement('div');
                qDiv.className = "p-3 bg-blue-100 rounded-lg text-right"; // Fondo azul claro
                const safeQuestion = question.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                qDiv.innerHTML = `<span class="font-bold text-gray-800">You:</span><p class="text-gray-900">${safeQuestion}</p>`;
                chatHistoryEl.appendChild(qDiv);
                
                const aDiv = document.createElement('div');
                aDiv.className = "p-3 bg-gray-200 rounded-lg";
                
                let formattedAnswer = answer
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/\n/g, "<br>")
                    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
                
                formattedAnswer = formattedAnswer.replace(
                    /\[(\d+)\] (.*?): (https?:\/\/[^\s]+)/g,
                    '<br>[<a href="$3" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline">$1</a>] $2'
                );

                aDiv.innerHTML = `<span class="font-bold text-blue-600">💡 FastMind:</span><div class="text-gray-800 mt-1">${formattedAnswer}</div>`;
                chatHistoryEl.appendChild(aDiv);

        async function handleChatSubmit(event) {
            event.preventDefault();
            const question = chatInput.value.trim();
            if (!question) return;

            chatInput.value = '';
            chatInput.disabled = true;
            chatSubmit.disabled = true;
            chatSpinner.classList.remove('hidden');

            try {
                const answer = await askFastMind(question);
                chatHistory.push([question, answer]);
                renderChatHistory();
            } catch (error) {
                console.error("Error asking FastMind:", error);
                chatHistory.push([question, "⚠️ There was an error contacting the assistant. Please try again."]);
                renderChatHistory();
            } finally {
                chatInput.disabled = false;
                chatSubmit.disabled = false;
                chatSpinner.classList.add('hidden');
                chatInput.focus();
            }
        }

        async function askFastMind(question) {
            const localKnowledgeBase = `
- **Primary Document:** fasting_guide.pdf
- **Key Topic:** The Five Most Common and Beneficial Types of Fasting.
- **1. Intermittent Fasting (IF) / Time-Restricted Eating (TRE):**
    - **Method:** Alternating between eating and fasting periods.
    - **Example (16/8):** Fast for 16 hours, eat within an 8-hour window (e.g., 12pm-8pm).
    - **Example (TRF):** Confine eating to a window of < 12 hours.
    - **Benefits:** Physical health and spiritual growth.
    - **Cultural Context:** Practiced in many religions (Ramadan, Yom Kippur, Lent, Navaratri).
`;
            const systemPrompt = "You are FastMind, a scientific fasting and wellness coach. You must answer in the language of the user's question. \n\n**Your Process (Hybrid RAG):** \n1. **FIRST,** try to answer the user's question using *only* the 'Local Knowledge Base' provided in the prompt. \n2. **SECOND,** if the answer is *not* in the Local Knowledge Base, *then* use Google Search to find scientific information, data, or guides to answer it.";
            const userQuery = `**Local KnowledgeBase:**
${localKnowledgeBase}
---
**User question:** ${question}`;
            
            // CAMBIO: API Key ahora es una cadena vacía, será proveída por la plataforma
            const apiKey = ""; 

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                tools: [{ "google_search": {} }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            let response;
            let retries = 0;
            const maxRetries = 3;
            let delay = 1000;
            
            while (retries < maxRetries) {
                try {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) break;
                    if (response.status === 429 || response.status >= 500) {
                        retries++;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                    } else {
                        const errorBody = await response.text();
                        console.error("API Error Body:", errorBody);
                        throw new Error(`API Error: ${response.status} ${response.statusText}`);
                    }
                } catch (error) {
                    console.error("Fetch attempt " + (retries + 1) + " failed:", error);
                    if (retries >= maxRetries - 1) throw error;
                    retries++;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }

            if (!response.ok) {
                throw new Error(`Failed to fetch from API after ${maxRetries} retries.`);
            }

            const result = await response.json();
            const candidate = result.candidates?.[0];
            let sources = [];
            let text = "Could not generate a response.";

            if (candidate && candidate.content?.parts?.[0]?.text) {
                text = candidate.content.parts[0].text;
                const groundingMetadata = candidate.groundingMetadata;
                if (groundingMetadata && groundingMetadata.groundingAttributions) {
                    sources = groundingMetadata.groundingAttributions
                        .map(attribution => ({
                            uri: attribution.web?.uri,
                            title: attribution.web?.title,
                        }))
                        .filter(source => source.uri && source.title);
                }
                if (sources.length > 0) {
                    text += "\n\n**Sources:**";
                    sources.forEach((source, index) => {
                        text += `\n[${index + 1}] ${source.title}: ${source.uri}`;
                    });
                }
            } else {
                 console.error("Invalid API response structure:", result);
                 throw new Error("Invalid API response structure.");
            }
            return text;
        }

        // --- 4. Firestore (Database) Functions ---

        /**
         * Save completed fast to Firestore
         * CAMBIO: Ruta de la colección actualizada
         */
        async function saveFastToFirestore(hours, durationString, phase) {
            if (!currentUser || !db) {
                console.error("No user or db to save fast for.");
                return;
            }

            try {
                // CAMBIO: Ruta de la colección actualizada para incluir artifacts/{appId}
                const docRef = await addDoc(collection(db, "artifacts", appId, "users", currentUser.uid, "fasts"), {
                    userId: currentUser.uid,
                    completedAt: serverTimestamp(), // Use server time
                    durationHours: hours,
                    durationString: durationString,
                    finalPhase: phase.keyword,
                    finalPhaseColor: phase.color_hex
                });
                console.log("Fast saved with ID: ", docRef.id);
                timerMessage.innerHTML += "<br><em>Saved to your history!</em>";
            } catch (e) {
                console.error("Error adding document: ", e);
                // This message will show if offline
                timerMessage.innerHTML += "<br><em>Saved offline. Will sync when online.</em>";
            }
        }

        /**
         * Load fasting history for current user
         * CAMBIO: Ruta de la colección actualizada
         */
        function loadFastingHistory() {
            if (!currentUser || !db) return;

            console.log("Loading history for user:", currentUser.uid);
            historyLoading.classList.remove('hidden');
            historyEmpty.classList.add('hidden');
            historyList.innerHTML = ''; // Clear list

            // CAMBIO: Ruta de la colección actualizada para incluir artifacts/{appId}
            const q = query(collection(db, "artifacts", appId, "users", currentUser.uid, "fasts"), orderBy("completedAt", "desc"));

            // onSnapshot listens for real-time updates (and works offline)
            historyUnsubscribe = onSnapshot(q, (querySnapshot) => {
                historyLoading.classList.add('hidden');
                const fasts = [];
                querySnapshot.forEach((doc) => {
                    fasts.push(doc.data());
                });

                allUserFasts = fasts; // <-- NEW: Store all fasts globally

                if (allUserFasts.length === 0) {
                    historyEmpty.classList.remove('hidden');
                    historyList.innerHTML = '';
                } else {
                    historyEmpty.classList.add('hidden');
                    renderHistoryList(allUserFasts); // Render list
                }
                
                // --- NEW: Render the calendar ---
                renderCalendar(currentCalendarMonth, currentCalendarYear, allUserFasts);
                
            }, (error) => {
                console.error("Error loading history:", error);
                historyLoading.classList.add('hidden');
                historyList.innerHTML = '<p class="text-red-500">Error loading history.</p>';
            });
        }

        /**
         * Render the list of fasts to the HTML
         */
        function renderHistoryList(fasts) {
            historyList.innerHTML = ''; // Clear list
            fasts.forEach(fast => {
                const div = document.createElement('div');
                div.className = "bg-gray-100 p-4 rounded-lg flex justify-between items-center"; // Fondo claro
                
                const date = fast.completedAt?.toDate().toLocaleDateString() || 'No date';
                const time = fast.completedAt?.toDate().toLocaleTimeString() || '';
                
                div.innerHTML = `
                    <div>
                        <p class="text-lg font-semibold text-gray-900">${date} <span class="text-sm text-gray-500">${time}</span></p>
                        <p class="text-gray-600">Duration: <span class="font-bold text-gray-900">${fast.durationString}</span></p>
                    </div>
                    <span class="font-bold py-1 px-3 rounded-full" style="color: ${fast.finalPhaseColor === '#F5F5F5' ? '#333' : '#FFF'}; background-color: ${fast.finalPhaseColor};">
                        ${fast.finalPhase}
                    </span>
                `;
                historyList.appendChild(div);
            });
        }
        
        // --- 5. NEW: Calendar Functions ---
        
        /**
         * Renders the calendar grid for the given month, year, and fasts
         */
        function renderCalendar(month, year, fasts) {
            calendarGridEl.innerHTML = '';
            calendarGridHeaderEl.innerHTML = '';
            
            // 1. Set Month/Year Title (using Spanish locale for month names)
            const monthName = new Date(year, month).toLocaleString('es-ES', { month: 'long' });
            monthYearEl.textContent = `${monthName.charAt(0).toUpperCase() + monthName.slice(1)} ${year}`;
            
            // 2. Create Day Headers (S, M, T...)
            const dayHeaders = ['S', 'M', 'T', 'W', 'T', 'F', 'S']; // English days
            dayHeaders.forEach(day => {
                const dayEl = document.createElement('div');
                dayEl.textContent = day;
                calendarGridHeaderEl.appendChild(dayEl);
            });
            
            // 3. Get calendar grid info (using Sunday as first day of week, locale-agnostic)
            const firstDayOfMonth = new Date(year, month, 1).getDay(); // 0 (Sun) - 6 (Sat)
            const daysInMonth = new Date(year, month + 1, 0).getDate(); // 30, 31, etc.
            
            // 4. Create a Set of fasted dates for quick lookup
            // Formato: "YYYY-MM-DD"
            const fastDates = new Set(
                fasts.map(f => {
                    const d = f.completedAt?.toDate();
                    if (!d) return null;
                    // Format to YYYY-MM-DD
                    const year = d.getFullYear();
                    const month = (d.getMonth() + 1).toString().padStart(2, '0');
                    const day = d.getDate().toString().padStart(2, '0');
                    return `${year}-${month}-${day}`;
                }).filter(Boolean) // Filtra nulos
            );
            
            // 5. Add empty cells for days before the 1st
            for (let i = 0; i < firstDayOfMonth; i++) {
                const emptyEl = document.createElement('div');
                calendarGridEl.appendChild(emptyEl);
            }
            
            // 6. Add all days of the month
            for (let day = 1; day <= daysInMonth; day++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day relative text-gray-800'; // Texto oscuro
                
                // Formatear la fecha como "YYYY-MM-DD" para comparar
                const dateString = `${year}-${(month + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
                
                let dayContent = `<span>${day}</span>`;
                
                // Check if this day was a fast day
                if (fastDates.has(dateString)) {
                    dayEl.classList.add('fasted-day');
                    dayContent += '<div class="fasted-dot"></div>';
                }
                
                dayEl.innerHTML = dayContent;
                calendarGridEl.appendChild(dayEl);
            }
        }
        
        /**
         * Shows the previous month's calendar
         */
        function showPrevMonth() {
            if (currentCalendarMonth === 0) {
                currentCalendarMonth = 11;
                currentCalendarYear--;
            } else {
                currentCalendarMonth--;
            }
            renderCalendar(currentCalendarMonth, currentCalendarYear, allUserFasts);
        }
        
        /**

         */

            if (currentCalendarMonth === 11) {
                currentCalendarMonth = 0;
                currentCalendarYear++;
            } else {
                currentCalendarMonth++;
            }
            renderCalendar(currentCalendarMonth, currentCalendarYear, allUserFasts);
