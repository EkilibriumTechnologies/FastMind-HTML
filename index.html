    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC; 
            color: #334155; 
        }
        
        .progress-circle {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: conic-gradient(#CBD5E1 0%, #E2E8F0 0); 
            transition: background 0.3s ease-out;
        }
        
        .progress-circle::before {
            content: "";
            width: 80%;
            height: 80%;
            background: #FFFFFF; 
            border-radius: 50%;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
        }

        .progress-text {
            position: absolute;
            text-align: center;
        }
        
        .chat-bubble-bot {
            background-color: #E2E8F0; 
            color: #334155; 
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            max-width: 80%;
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
        .chat-bubble-user {
            background-color: #0EA5E9; 
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            max-width: 80%;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        
        .calendar-day {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 40px;
            width: 100%;
        }
        .calendar-day.fasted-day span {
            font-weight: bold;
            color: #0F172A; 
        }
        .fasted-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #38BDF8; 
            margin-top: 2px;
        }

        .nav-btn.active {
            color: #0EA5E9; 
        }

        /* --- Settings Panel Styles --- */
        #settings-panel {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #settings-panel.hidden {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }
        /* Custom radio button styling */
        .settings-toggle-label {
            display: block;
            padding: 0.75rem 1rem;
            background-color: #F1F5F9; /* slate-100 */
            border: 1px solid #CBD5E1; /* slate-300 */
            border-radius: 0.5rem;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            color: #475569; /* slate-600 */
            transition: all 0.2s ease;
        }
        .settings-toggle-input:checked + .settings-toggle-label {
            background-color: #0EA5E9; /* sky-500 */
            color: white;
            border-color: #0EA5E9; /* sky-500 */
            box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.2), 0 2px 4px -1px rgba(14, 165, 233, 0.1);
        }
        .settings-toggle-input {
            display: none; /* Hide the actual radio button */
        }
        
        /* Simple Checkbox Toggle for Mute */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #CBD5E1; /* slate-300 */
            transition: .4s;
            border-radius: 28px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #0EA5E9; /* sky-500 */
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
