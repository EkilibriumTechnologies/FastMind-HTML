<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastMind</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Estilos para probar la funcionalidad Premium */
        .premium-enabled { background-color: #f0f8ff; } /* Ejemplo visual */
        .premium-only { display: none; } /* Oculto por defecto */
        .locked-free { opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body>

    <h1>FastMind HTML</h1>
    
    <button onclick="comprarPremium()">Comprar Premium (Mensual)</button>
    
    <div class="locked-free">
        <p>Contenido Gratuito (Se bloquea si no eres premium... lógica inversa en tu script)</p>
    </div>
    <div class="premium-only">
        <p>✨ ¡Contenido Exclusivo Premium! ✨</p>
    </div>


    <script>
        // ======== FASTMIND PREMIUM SYSTEM ======== //
        // Detectamos si estamos en una app nativa con Capacitor
        const isNative = typeof Capacitor !== "undefined" && Capacitor.isNativePlatform();

        console.log("Native App:", isNative);

        // Cargar estado premium guardado
        function isPremiumUser() {
            return localStorage.getItem("fastmind_premium") === "true";
        }

        // Activar Premium
        function activarPremium() {
            localStorage.setItem("fastmind_premium", "true");
            console.log("🔥 Premium activado");
            document.body.classList.add("premium-enabled");
            actualizarUI(); // Forzar actualización inmediata
        }

        // Desactivar Premium (para pruebas)
        function desactivarPremium() {
            localStorage.setItem("fastmind_premium", "false");
            console.log("❌ Premium desactivado");
            document.body.classList.remove("premium-enabled");
            actualizarUI();
        }

        // Mostrar/ocultar funciones premium
        function actualizarUI() {
            const premium = isPremiumUser();
            const premiumElements = document.querySelectorAll(".premium-only");

            premiumElements.forEach(el => {
                el.style.display = premium ? "block" : "none";
            });

            // Si tienes elementos que se ven en free pero se bloquean (o viceversa)
            // Ajusta esta lógica según tu diseño real
            const freeLocked = document.querySelectorAll(".locked-free");
            freeLocked.forEach(el => {
                 // Si es premium, se ve bien (1). Si no, se ve opaco (0.4)
                el.style.opacity = premium ? "1" : "0.4";
                el.style.pointerEvents = premium ? "auto" : "none";
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            actualizarUI();
        });


        // ======== NATIVO: CONFIGURAR BILLING ======== //
        if (isNative) {
            // Esperamos a deviceready que es disparado por el plugin de cordova
            document.addEventListener("deviceready", () => {
                console.log("Device Ready: Iniciando sistema de compras…");

                // Verificamos que el plugin se haya cargado
                if (!window.store) {
                    console.error("El plugin de compras no está instalado o falló al cargar.");
                    return;
                }

                store.verbosity = store.DEBUG;

                // Registrar suscripción mensual
                // IMPORTANTE: "fastmind_premium_monthly" debe existir en Google Play Console
                store.register({
                    id: "fastmind_premium_monthly",
                    type: store.SUBSCRIPTION
                });

                // Cuando aprueban el pago
                store.when("fastmind_premium_monthly").approved((order) => {
                    order.finish();
                    activarPremium();
                    alert("¡Gracias por tu compra! Premium Activado.");
                });

                store.ready(() => {
                    console.log("🟢 Billing listo");
                });

                store.refresh();
            });
        }

        // ======== BOTÓN PARA COMPRAR PREMIUM ======== //
        function comprarPremium() {
            if (!isNative) {
                alert("Esta compra solo está disponible en la app instalada desde Google Play.");
                // Para pruebas en web, descomenta esto si quieres simular:
                // activarPremium(); 
                return;
            }
            
            if(window.store) {
                store.order("fastmind_premium_monthly");
            } else {
                alert("Error: Tienda no inicializada");
            }
        }

        // ======== TEST BUTTONS (solo para web) ======== //
        window.testPremiumOn = activarPremium;
        window.testPremiumOff = desactivarPremium;
    </script>
</body>
</html>
